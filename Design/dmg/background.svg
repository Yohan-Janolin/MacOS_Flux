<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF8"/>
      <stop offset="1" stop-color="#FFF1EA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.06" cy="0.96" r="0.55">
      <stop offset="0" stop-color="#FFB054" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFB054" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.96" cy="0.04" r="0.55">
      <stop offset="0" stop-color="#E8336B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E8336B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="398" y2="0">
      <stop offset="0" stop-color="#FFB054"/>
      <stop offset="0.5" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#E8336B"/>
    </linearGradient>
    <!-- Motif de l'icône : point et ondes du flux -->
    <g id="waves" fill="none" stroke="#FF6A3D" stroke-width="20" stroke-linecap="round">
      <circle cx="0" cy="0" r="14" fill="#FF6A3D" stroke="none"/>
      <path d="M 0 -52 A 52 52 0 0 1 52 0"/>
      <path d="M 0 -90 A 90 90 0 0 1 90 0"/>
      <path d="M 0 -125 A 125 125 0 0 1 125 0" stroke-opacity="0.45"/>
    </g>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glowA)"/>
  <rect width="660" height="400" fill="url(#glowB)"/>

  <!-- Ondes décoratives, très discrètes, dans deux coins -->
  <g opacity="0.10"><use href="#waves" transform="translate(560 120) scale(1.1)"/></g>
  <g opacity="0.09"><use href="#waves" transform="translate(40 440) scale(1.0)"/></g>

  <!-- Nom, en haut -->
  <text x="330" y="58" text-anchor="middle" font-family="SF Pro Display, Inter Display, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#2A1A14" letter-spacing="0.5">Flux</text>

  <!-- Flèche de l'app vers Applications (icônes centrées en x=180 et x=480, y=200) -->
  <g fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 200 Q 330 172 398 200" stroke-width="6"/>
    <path d="M385.8 184.2 L 398 200 L 378.2 202.7" stroke-width="6"/>
  </g>
</svg>
